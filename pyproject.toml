[project]
name = "fine-tuning-studio"
version = "1.0.0"
description = "Local-first UI for fine-tuning and exporting AI models"
readme = "README.md"
requires-python = ">=3.12.10,<3.15"
license = "Apache-2.0"
dependencies = [
  "accelerate",
  "bitsandbytes",
  "datasets",
  "huggingface-hub",
  "pyarrow",
  "peft",
  "psutil",
  "safetensors",
  "streamlit>=1.59.1,<2",
  "torch",
  "transformers",
  "trl",
]

[project.scripts]
fine-tuning-studio = "fine_tuning_studio.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
