name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: >-
          uv run pytest -q
          --cov=fine_tuning_studio.domain
          --cov=fine_tuning_studio.storage
          --cov=fine_tuning_studio.evals
          --cov=fine_tuning_studio.artifacts
          --cov=fine_tuning_studio.resources
          --cov=fine_tuning_studio.recipes
          --cov-fail-under=80
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv build
      - run: uv run fine-tuning-studio version

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --dev
      - run: uv run pip-audit --local --progress-spinner off
